name: Check jobs

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (7am US Eastern)
  workflow_dispatch:        # adds a "Run workflow" button for an on-demand check

permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check job boards
        run: python jobwatch.py --no-open
      - name: Publish page
        run: |
          cp jobs.html index.html
          git config user.name "job-watch-bot"
          git config user.email "job-watch-bot@users.noreply.github.com"
          git add index.html seen.json
          git diff --cached --quiet || git commit -m "Update job list"
          git push
