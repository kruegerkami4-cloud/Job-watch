name: Probe job sites (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python probe/probe.py
      - run: |
          git config user.name job-watch-bot; git config user.email job-watch-bot@users.noreply.github.com
          git checkout --orphan probe-results; git rm -rq --cached .; git add -f out; git commit -qm probe; git push -f origin probe-results
